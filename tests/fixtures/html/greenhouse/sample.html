<!doctype html>
<html>
  <body>
    <form id="application_form">
      <div class="field">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="job_application[email]" autocomplete="email" />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="resume">Resume/CV</label>
        <input type="file" id="resume" name="job_application[resume]" />
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn Profile</label>
        <input type="text" id="linkedin" name="job_application[urls][LinkedIn]" />
      </div>
      <div class="field">
        <label for="notice">Notice period</label>
        <select id="notice" name="job_application[notice_period]">
          <option value="">Select...</option>
          <option value="immediate">Immediate</option>
          <option value="2w">2 weeks</option>
          <option value="1m">1 month</option>
        </select>
      </div>
      <div class="field">
        <label for="sponsorship">Will you now or in the future require sponsorship?</label>
        <select id="sponsorship" name="job_application[sponsorship]">
          <option value="">Select...</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>Are you willing to relocate?</legend>
        <label><input type="radio" name="relocation" value="yes" /> Yes</label>
        <label><input type="radio" name="relocation" value="no" /> No</label>
      </fieldset>
      <div class="field">
        <label for="cover_letter">Why do you want to work here?</label>
        <textarea id="cover_letter" name="job_application[cover_letter]"></textarea>
      </div>
    </form>
  </body>
</html>
