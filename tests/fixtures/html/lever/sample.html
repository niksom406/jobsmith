<!doctype html>
<html>
  <body>
    <div class="application-form">
      <div class="application-question">
        <div class="application-label">Full name</div>
        <input type="text" name="name" autocomplete="name" />
      </div>
      <div class="application-question">
        <div class="application-label">Email</div>
        <input type="email" name="email" autocomplete="email" />
      </div>
      <div class="application-question">
        <div class="application-label">Phone</div>
        <input type="tel" name="phone" autocomplete="tel" />
      </div>
      <div class="application-question">
        <div class="application-label">Current location</div>
        <input type="text" name="location" />
      </div>
      <div class="application-question">
        <div class="application-label">Resume</div>
        <input type="file" name="resume" />
      </div>
      <div class="application-question">
        <div class="application-label">Additional Information</div>
        <textarea name="comments"></textarea>
      </div>
      <div class="application-question">
        <div class="application-label">Do you require visa sponsorship?</div>
        <select name="sponsorship">
          <option value="">Select</option>
          <option value="y">Yes - I require sponsorship</option>
          <option value="n">No - I do not require sponsorship</option>
        </select>
      </div>
    </div>
  </body>
</html>
